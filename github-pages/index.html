    <script>
      (function () {
        function tfApplyPresentationScale() {
          var w = window.innerWidth,
            h = window.innerHeight,
            minW = 1024,
            baseW = 1280,
            baseH = 800,
            minS = 1,
            maxS = 1.35,
            s = 1;
          if (w >= minW) {
            s = w / baseW;
            var hf = Math.min(1.08, Math.max(0.92, h / baseH));
            s = s * (0.88 + 0.12 * hf);
            try {
              if (
                window.matchMedia("(display-mode: fullscreen)").matches ||
                window.matchMedia("(display-mode: standalone)").matches ||
                (w >= 1600 && Math.min(w, h) >= 900)
              )
                s *= 1.04;
            } catch (e) {}
            s = Math.min(maxS, Math.max(minS, Math.round(s * 1000) / 1000));
          }
          var r = document.documentElement;
          r.style.setProperty("--ui-scale", String(s));
          r.style.fontSize = (s * 100).toFixed(3) + "%";
          r.setAttribute(
            "data-presentation-scale",
            s > 1.02 ? "active" : "baseline",
          );
        }
        tfApplyPresentationScale();
        var t;
        window.addEventListener("resize", function () {
          clearTimeout(t);
          t = setTimeout(tfApplyPresentationScale, 100);
        });
        window.addEventListener("orientationchange", function () {
          tfApplyPresentationScale();
        });
        try {
          window
            .matchMedia("(display-mode: fullscreen)")
            .addEventListener("change", tfApplyPresentationScale);
        } catch (e) {}
      })();
    </script>
